<!DOCTYPE html>
<html lang="ko" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poticard - 포트폴리오 만들기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/header.css">  
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <script>
        // Tailwind 설정 (기존과 동일)
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'point-yellow': '#FACC15',
                        'pastel-yellow': '#FEF9C3',
                    }
                }
            }
        }
        
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
        }
    </script>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
        .font-poppins { font-family: 'Poppins', sans-serif; }
        
        .bg-pattern {
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .dark .bg-pattern {
            background-color: #18181b;
            background-image: radial-gradient(#3f3f46 1px, transparent 1px);
        }
    </style>
</head>
<body class="bg-pattern text-gray-800 dark:text-gray-100 transition-colors duration-300 flex flex-col min-h-screen">

    <!-- header fetch -->
    <div id="header-placeholder"></div>

    <!-- 2. 메인 콘텐츠 -->
    <main class="flex-1 pt-24 pb-20 px-4">
        <div class="max-w-3xl mx-auto">
            
            <!-- 단계 표시기 (Progress Bar) -->
            <div class="mb-10">
                <div class="flex justify-between text-sm font-bold text-gray-400 mb-2 px-1">
                    <span class="text-point-yellow">01. 기본 정보</span>
                    <span>02. 프로젝트</span>
                    <span>03. 스타일</span>
                </div>
                <div class="w-full h-2 bg-gray-200 dark:bg-zinc-800 rounded-full overflow-hidden">
                    <div class="w-1/3 h-full bg-point-yellow rounded-full shadow-[0_0_10px_#FACC15]"></div>
                </div>
            </div>

            <!-- 입력 폼 카드 -->
            <div class="bg-white dark:bg-zinc-900 rounded-3xl shadow-xl border border-gray-100 dark:border-zinc-800 p-8 md:p-10 relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-point-yellow to-orange-300"></div>

                <div class="mb-8">
                    <h2 class="text-2xl font-bold text-gray-900 dark:text-white mb-1">기본 정보 입력</h2>
                    <p class="text-sm text-gray-500 dark:text-gray-400">명함의 가장 앞면에 들어갈 핵심 정보를 입력해주세요.</p>
                </div>

                <form class="space-y-8">
                    
                    <!-- 섹션 1: 프로필 이미지 및 헤드라인 -->
                    <div class="flex flex-col md:flex-row gap-8 items-start">
                        <!-- 이미지 업로드 -->
                        <div class="group relative w-32 h-32 flex-shrink-0 mx-auto md:mx-0">
                            <div class="w-full h-full rounded-full bg-gray-100 dark:bg-zinc-800 border-2 border-dashed border-gray-300 dark:border-zinc-700 flex items-center justify-center overflow-hidden hover:border-point-yellow transition-colors cursor-pointer">
                                <img id="preview-img" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" class="w-full h-full object-cover opacity-50 group-hover:opacity-100 transition-opacity" alt="Profile">
                                <div class="absolute inset-0 flex items-center justify-center bg-black/30 opacity-0 group-hover:opacity-100 transition-opacity">
                                    <i class="fa-solid fa-camera text-white text-xl"></i>
                                </div>
                            </div>
                            <input type="file" class="hidden">
                            <p class="text-center text-[10px] text-gray-400 mt-2">프로필 사진 변경</p>
                        </div>

                        <!-- 제목 입력 -->
                        <div class="flex-1 w-full space-y-4">
                            <div class="space-y-1">
                                <label class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase">포트폴리오 제목 (한줄 소개)</label>
                                <input type="text" placeholder="예: 사용자 경험을 디자인하는 UX 디자이너 김포티입니다." class="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-zinc-800 border-2 border-transparent focus:border-point-yellow focus:bg-white dark:focus:bg-zinc-900 outline-none transition-all font-bold text-lg text-gray-900 dark:text-white placeholder-gray-400">
                            </div>
                            <div class="space-y-1">
                                <label class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase">이름</label>
                                <input type="text" value="김포티" class="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-zinc-800 border-2 border-transparent focus:border-point-yellow focus:bg-white dark:focus:bg-zinc-900 outline-none transition-all text-gray-900 dark:text-white">
                            </div>
                        </div>
                    </div>

                    <hr class="border-gray-100 dark:border-zinc-800">

                    <!-- 섹션 2: 상세 정보 -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-1">
                            <label class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase">연락처 (Email)</label>
                            <input type="email" placeholder="contact@poticard.io" class="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-zinc-800 border-2 border-transparent focus:border-point-yellow focus:bg-white dark:focus:bg-zinc-900 outline-none transition-all text-gray-900 dark:text-white">
                        </div>
                        <div class="space-y-1">
                            <label class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase">전화번호 (Optional)</label>
                            <input type="tel" placeholder="010-1234-5678" class="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-zinc-800 border-2 border-transparent focus:border-point-yellow focus:bg-white dark:focus:bg-zinc-900 outline-none transition-all text-gray-900 dark:text-white">
                        </div>
                    </div>

                    <!-- 섹션 3: 소셜 링크 -->
                    <div class="space-y-4">
                        <label class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase">소셜 & 포트폴리오 링크</label>
                        
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-lg bg-gray-100 dark:bg-zinc-800 flex items-center justify-center text-gray-600 dark:text-gray-400">
                                <i class="fa-brands fa-github text-xl"></i>
                            </div>
                            <input type="url" placeholder="GitHub 주소 입력" class="flex-1 px-4 py-3 rounded-xl bg-gray-50 dark:bg-zinc-800 border-2 border-transparent focus:border-point-yellow focus:bg-white dark:focus:bg-zinc-900 outline-none transition-all text-gray-900 dark:text-white">
                        </div>

                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-lg bg-gray-100 dark:bg-zinc-800 flex items-center justify-center text-gray-600 dark:text-gray-400">
                                <i class="fa-brands fa-linkedin text-xl"></i>
                            </div>
                            <input type="url" placeholder="LinkedIn 주소 입력" class="flex-1 px-4 py-3 rounded-xl bg-gray-50 dark:bg-zinc-800 border-2 border-transparent focus:border-point-yellow focus:bg-white dark:focus:bg-zinc-900 outline-none transition-all text-gray-900 dark:text-white">
                        </div>

                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-lg bg-gray-100 dark:bg-zinc-800 flex items-center justify-center text-gray-600 dark:text-gray-400">
                                <i class="fa-solid fa-link text-lg"></i>
                            </div>
                            <input type="url" placeholder="블로그 또는 기타 URL" class="flex-1 px-4 py-3 rounded-xl bg-gray-50 dark:bg-zinc-800 border-2 border-transparent focus:border-point-yellow focus:bg-white dark:focus:bg-zinc-900 outline-none transition-all text-gray-900 dark:text-white">
                        </div>
                    </div>

                    <!-- 하단 액션 버튼 -->
                    <div class="pt-6 flex justify-end gap-4">
                        <button type="button" class="px-6 py-3 rounded-xl font-bold text-gray-500 hover:bg-gray-100 dark:hover:bg-zinc-800 transition-colors">
                            취소
                        </button>
                        <button type="button" class="px-8 py-3 bg-point-yellow text-gray-900 rounded-xl font-bold shadow-lg shadow-yellow-200/50 dark:shadow-none hover:bg-yellow-300 transform hover:-translate-y-0.5 transition-all">
                            다음 단계 <i class="fa-solid fa-arrow-right ml-2"></i>
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </main>

    <!-- 3. 푸터 -->
    <footer class="bg-white dark:bg-zinc-900 border-t border-gray-100 dark:border-zinc-800 py-10 mt-auto transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-6 text-center">
            <p class="text-xs text-gray-400 dark:text-gray-500">
                Poticard Editor &copy; 2024. 작성 중인 내용은 자동으로 임시 저장됩니다.
            </p>
        </div>
    </footer>

    <!-- header.html fetch -->
   <script src="assets/js/header.js"></script>

</body>
</html>
