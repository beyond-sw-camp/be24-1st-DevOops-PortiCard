<!DOCTYPE html>
<html lang="ko" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>

    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/header.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <script>
      tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          boxShadow: { soft: '0 12px 32px rgba(0,0,0,.08)' },
          fontFamily: {
            sans: ['Noto Sans KR', 'sans-serif'],
            poppins: ['Poppins', 'sans-serif'],
          }
        }
      }
    };
        
        // 테마 토글 함수
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
        }
        // 전화번호 자동 하이픈
        const autoHyphen = (target) => {
            target.value = target.value
            .replace(/[^0-9]/g, '') // 숫자가 아닌 문자 제거
            .replace(/^(\d{0,3})(\d{0,4})(\d{0,4})$/g, "$1-$2-$3") // 하이픈 추가
            .replace(/(\-{1,2})$/g, ""); // 끝에 남은 하이픈 제거
        }        
    </script>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
        }
        .font-poppins {
            font-family: 'Poppins', sans-serif;
        }
        
        /* 배경 패턴 (다크모드 대응) */
        .bg-pattern {
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .dark .bg-pattern {
            background-color: #18181b; /* zinc-900 */
            background-image: radial-gradient(#3f3f46 1px, transparent 1px);
        }
    </style>
</head>
<body class="bg-white dark:bg-zinc-900 text-gray-800 dark:text-gray-100 font-sans transition-colors duration-300">
    <!-- header fetch -->
    <div id="app-header"></div>
    <div id="app-header"></div>
    <div id="authModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal-card">
      <div class="rounded-3xl border border-gray-100 dark:border-zinc-800 bg-white/95 dark:bg-zinc-900/95 backdrop-blur-md shadow-2xl p-5">
        <div class="flex items-center justify-between mb-4">
          <p class="text-sm font-black text-gray-900 dark:text-white">회원 선택</p>
          <button id="authClose" class="w-9 h-9 rounded-xl hover:bg-gray-50 dark:hover:bg-zinc-800 flex items-center justify-center" aria-label="닫기">✕</button>
        </div>
        <div class="grid grid-cols-1 gap-3">
          <a href="login.html" class="w-full px-4 py-4 rounded-2xl border border-gray-100 dark:border-zinc-800 bg-gray-50 dark:bg-zinc-800/60 hover:border-point-yellow transition text-left block">
            <span class="text-base font-black text-gray-900 dark:text-white">👤 개인</span>
          </a>
          <a href="login.html" class="w-full px-4 py-4 rounded-2xl border border-gray-100 dark:border-zinc-800 bg-gray-50 dark:bg-zinc-800/60 hover:border-point-yellow transition text-left block">
            <span class="text-base font-black text-gray-900 dark:text-white">🏢 법인</span>
          </a>
        </div>
      </div>
    </div>
  </div>

    <!-- 2. 메인 콘텐츠 (회원가입) -->
    <main class="flex-1 flex items-center justify-center pt-12 pb-12 px-4">
        
        <div class="w-full max-w-lg bg-white dark:bg-zinc-900 rounded-3xl shadow-2xl border border-gray-100 dark:border-zinc-800 overflow-hidden relative">
            <!-- 장식용 상단 바 -->
            <div class="h-2 bg-point-yellow w-full"></div>
            
            <div class="p-8 md:p-10">
                <div class="text-center mb-8">
                    <h2 class="text-3xl font-black font-poppins text-gray-900 dark:text-white mb-2">Join Poticard</h2>
                    <p class="text-gray-500 dark:text-gray-400 text-sm">당신의 포트폴리오를 명함 한 장으로 표현하세요.</p>
                </div>

                <form class="space-y-6">
                    <!-- 이름 입력 -->
                    <div class="space-y-2">
                        <label class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wide">Name</label>
                        <input type="text" placeholder="홍길동" class="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-zinc-800 border-2 border-transparent focus:border-point-yellow focus:bg-white dark:focus:bg-zinc-900 outline-none transition-all text-gray-900 dark:text-white placeholder-gray-400">
                    </div>

                    <!-- 이메일 입력 -->
                    <div class="space-y-2">
                        <label class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wide">Email</label>
                        <input type="email" placeholder="example@poticard.io" class="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-zinc-800 border-2 border-transparent focus:border-point-yellow focus:bg-white dark:focus:bg-zinc-900 outline-none transition-all text-gray-900 dark:text-white placeholder-gray-400">
                    </div>

                    <!-- 비밀번호 입력 -->
                    <div class="space-y-2">
                        <label class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wide">Password</label>
                        <input type="password" placeholder="••••••••" class="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-zinc-800 border-2 border-transparent focus:border-point-yellow focus:bg-white dark:focus:bg-zinc-900 outline-none transition-all text-gray-900 dark:text-white placeholder-gray-400">
                    </div>
                    
                    <!-- 전화번호 -->
                    <div class="space-y-2">
                        <label class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wide">Phone</label>
                        <input type="tel" oninput="autoHyphen(this)" id = "auto-phone" placeholder="숫자만 입력해 주세요" pattern="01[016789]-[0-9]{3,4}-[0-9]{4}" class="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-zinc-800 border-2 border-transparent focus:border-point-yellow focus:bg-white dark:focus:bg-zinc-900 outline-none transition-all text-gray-900 dark:text-white placeholder-gray-400">
                    </div>

                    <!-- 가입 버튼 -->
                    <button type="submit" class="w-full py-4 mt-4 bg-point-yellow text-gray-900 rounded-xl font-bold shadow-lg shadow-yellow-200/50 dark:shadow-none hover:bg-yellow-300 transform hover:-translate-y-0.5 transition-all text-lg">
                        포티카드 시작하기
                    </button>
                </form>
                <br>
            
                <!-- 소셜 로그인 섹션 (신규 추가) -->
                 
                <div class="mb-8">
                    <div class="relative flex items-center justify-center">
                        <div class="border-t border-gray-200 dark:border-zinc-700 w-full absolute"></div>
                        <span class="bg-white dark:bg-zinc-900 px-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest relative z-10">Or join with social</span>
                    </div>
                    <br>
                    <div class="flex justify-center gap-4 mb-8">
                        <!-- Google -->
                        <button class="w-12 h-12 rounded-full bg-white dark:bg-zinc-800 border border-gray-200 dark:border-zinc-700 flex items-center justify-center text-gray-600 dark:text-gray-400 hover:border-point-yellow hover:text-point-yellow hover:shadow-lg hover:-translate-y-1 transition-all duration-300">
                            <i class="fa-brands fa-google text-lg"></i>
                        </button>
                        <!-- GitHub -->
                        <button class="w-12 h-12 rounded-full bg-white dark:bg-zinc-800 border border-gray-200 dark:border-zinc-700 flex items-center justify-center text-gray-600 dark:text-gray-400 hover:border-point-yellow hover:text-point-yellow hover:shadow-lg hover:-translate-y-1 transition-all duration-300">
                            <i class="fa-brands fa-github text-lg"></i>
                        </button>
                        <!-- Facebook -->
                        <button class="w-12 h-12 rounded-full bg-white dark:bg-zinc-800 border border-gray-200 dark:border-zinc-700 flex items-center justify-center text-gray-600 dark:text-gray-400 hover:border-point-yellow hover:text-point-yellow hover:shadow-lg hover:-translate-y-1 transition-all duration-300">
                            <i class="fa-brands fa-facebook-f text-lg"></i>
                        </button>
                        <!-- Naver (Custom Icon) -->
                        <button class="w-12 h-12 rounded-full bg-white dark:bg-zinc-800 border border-gray-200 dark:border-zinc-700 flex items-center justify-center text-gray-600 dark:text-gray-400 hover:border-point-yellow hover:text-point-yellow hover:shadow-lg hover:-translate-y-1 transition-all duration-300 group">
                            <span class="font-black text-sm font-sans tracking-tighter group-hover:text-point-yellow">N</span>
                        </button>
                    </div>
                </div>

                <p class="text-center mt-6 text-sm text-gray-400">
                    이미 계정이 있으신가요? <a href="login.html" class="text-point-yellow hover:underline font-bold">로그인</a>
                </p>
            </div>
        </div>

    </main>

    <!-- footer fetch -->
    <div id="footer-placeholder"></div>
    <!-- 헤더, 풋터 fetch -->
    <script src="assets/js/header.js"></script>
    <script src="assets/js/footer.js"></script>
</html>
