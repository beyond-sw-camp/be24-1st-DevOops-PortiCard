<!DOCTYPE html>
<html lang="ko" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poticard - 포트폴리오 명함</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/header.css"> 
    <script>
        // Tailwind 다크모드 설정
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'point-yellow': '#FACC15',
                        'pastel-yellow': '#FEF9C3',
                    }
                }
            }
        }
        
        // 테마 토글 함수
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
        }
    </script>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
        }
        .font-poppins {
            font-family: 'Poppins', sans-serif;
        }
        
        /* 스크롤바 커스텀 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #d4d4d8; 
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #52525b; 
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a1a1aa; 
        }

        /* 카드 겹침 효과 */
        .card-stack:hover .card-item {
            margin-left: -20px;
            transform: rotate(0deg) translateY(-10px);
        }
        
        .card-item {
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer;
        }
        
        .card-item:hover {
            z-index: 50 !important;
            transform: scale(1.05) translateY(-15px) !important;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border-color: #FACC15 !important;
        }

        /* 배경 패턴 (다크모드 대응) */
        .bg-pattern {
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .dark .bg-pattern {
            background-color: #18181b; /* zinc-900 */
            background-image: radial-gradient(#3f3f46 1px, transparent 1px);
        }
    </style>
</head>
<body class="bg-pattern text-gray-800 dark:text-gray-100 transition-colors duration-300">

    <!-- header fetch -->
    <div id="header-placeholder"></div>

    <div class="flex pt-16 min-h-screen">
        
        <!-- 2. 좌측 고정 패널 (기업용 필터) -->
        <aside class="fixed left-0 top-16 h-[calc(100vh-4rem)] w-64 bg-white/90 dark:bg-zinc-900/90 backdrop-blur border-r border-gray-100 dark:border-zinc-800 p-6 overflow-y-auto z-40 hidden lg:block transition-colors duration-300">
            <div class="mb-8">
                <h2 class="text-xs font-black text-point-yellow uppercase tracking-wider mb-6 flex items-center gap-2">
                    <span class="w-2 h-2 bg-point-yellow rounded-full"></span> Targeting
                </h2>
                
                <div class="space-y-6">
                    <!-- 필터 그룹 1 -->
                    <div>
                        <h3 class="font-bold text-gray-800 dark:text-gray-200 mb-3 flex justify-between items-center text-sm">
                            직군 (Job Group)
                        </h3>
                        <div class="space-y-2.5">
                            <label class="flex items-center gap-3 cursor-pointer group p-2 rounded-lg hover:bg-gray-50 dark:hover:bg-zinc-800 transition-colors">
                                <input type="checkbox" class="w-4 h-4 rounded border-gray-300 text-yellow-500 focus:ring-yellow-500 bg-gray-100 dark:bg-zinc-700 dark:border-zinc-600">
                                <span class="text-sm text-gray-600 dark:text-gray-400 group-hover:text-gray-900 dark:group-hover:text-white transition-colors">기획/PM</span>
                            </label>
                            <label class="flex items-center gap-3 cursor-pointer group p-2 rounded-lg hover:bg-gray-50 dark:hover:bg-zinc-800 transition-colors">
                                <input type="checkbox" checked class="w-4 h-4 rounded border-gray-300 text-yellow-500 focus:ring-yellow-500 bg-gray-100 dark:bg-zinc-700 dark:border-zinc-600">
                                <span class="text-sm text-gray-600 dark:text-gray-400 group-hover:text-gray-900 dark:group-hover:text-white transition-colors">디자인</span>
                            </label>
                            <label class="flex items-center gap-3 cursor-pointer group p-2 rounded-lg hover:bg-gray-50 dark:hover:bg-zinc-800 transition-colors">
                                <input type="checkbox" checked class="w-4 h-4 rounded border-gray-300 text-yellow-500 focus:ring-yellow-500 bg-gray-100 dark:bg-zinc-700 dark:border-zinc-600">
                                <span class="text-sm text-gray-600 dark:text-gray-400 group-hover:text-gray-900 dark:group-hover:text-white transition-colors">개발 (FE/BE)</span>
                            </label>
                        </div>
                    </div>

                    <div class="w-full h-px bg-gray-100 dark:bg-zinc-800 my-4"></div>

                    <!-- 필터 그룹 2 (태그 스타일 변경) -->
                    <div>
                        <h3 class="font-bold text-gray-800 dark:text-gray-200 mb-3 text-sm">필수 스킬</h3>
                        <div class="flex flex-wrap gap-2">
                            <span class="px-3 py-1.5 bg-yellow-50 dark:bg-yellow-900/20 text-yellow-700 dark:text-yellow-400 text-xs font-bold rounded-lg cursor-pointer border border-yellow-100 dark:border-yellow-900/30 hover:bg-yellow-100 dark:hover:bg-yellow-900/40 transition-colors">React</span>
                            <span class="px-3 py-1.5 bg-gray-50 dark:bg-zinc-800 text-gray-600 dark:text-gray-400 text-xs font-medium rounded-lg cursor-pointer border border-gray-200 dark:border-zinc-700 hover:bg-gray-100 dark:hover:bg-zinc-700 transition-colors">Figma</span>
                            <span class="px-3 py-1.5 bg-gray-50 dark:bg-zinc-800 text-gray-600 dark:text-gray-400 text-xs font-medium rounded-lg cursor-pointer border border-gray-200 dark:border-zinc-700 hover:bg-gray-100 dark:hover:bg-zinc-700 transition-colors">Python</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 하단 버튼 (Yellow 포인트) -->
            <div class="absolute bottom-6 left-6 right-6">
                <button class="w-full py-3 bg-gray-900 dark:bg-white text-white dark:text-gray-900 rounded-2xl font-black hover:bg-gray-800 dark:hover:bg-gray-200 shadow-lg transition-all transform hover:-translate-y-1">
                    필터 적용하기
                </button>
            </div>
        </aside>

        <!-- 3. 메인 콘텐츠 -->
        <main class="flex-1 lg:ml-64 p-8 overflow-x-hidden">
            
            <div class="max-w-6xl mx-auto space-y-20">
                <!-- 헤드라인 -->
                <div class="text-center space-y-2 mb-12 pt-8">
                    <span class="px-3 py-1 rounded-full bg-yellow-100 dark:bg-yellow-900/30 text-yellow-700 dark:text-yellow-400 text-xs font-bold tracking-wide">TODAY'S PICK</span>
                    <h2 class="text-4xl font-black text-gray-900 dark:text-white tracking-tight">
                        주목해야 할 <span class="text-point-yellow relative inline-block">
                            인재
                            <svg class="absolute w-full h-2 bottom-1 left-0 text-yellow-200 dark:text-yellow-800 -z-10" viewBox="0 0 100 10" preserveAspectRatio="none">
                                <path d="M0 5 Q 50 10 100 5" stroke="currentColor" stroke-width="8" fill="none" opacity="0.5"/>
                            </svg>
                        </span>
                    </h2>
                    <p class="text-gray-500 dark:text-gray-400">귀사의 팀 컬처와 딱 맞는 멤버를 찾아보세요.</p>
                </div>

                <!-- 첫 번째 줄: 프리미엄 (중앙 정렬) -->
                <div class="relative w-full h-72 flex justify-center items-center card-stack perspective-1000">
                    <div id="row1-container" class="flex items-center justify-center w-full">
                        <!-- JS Cards -->
                    </div>
                </div>

                <!-- 두 번째 줄: 라이징 스타 -->
                <div class="space-y-6">
                    <div class="flex items-center gap-3 mb-4 px-4">
                        <div class="w-10 h-10 bg-pastel-yellow dark:bg-yellow-500/20 rounded-xl flex items-center justify-center text-xl">🚀</div>
                        <div>
                            <h3 class="text-xl font-bold text-gray-900 dark:text-white">새로 떠오르는 루키</h3>
                            <p class="text-xs text-gray-500 dark:text-gray-400">빠른 성장세를 보이는 주니어 인재들</p>
                        </div>
                    </div>
                    <div class="relative w-full h-64 flex justify-center items-center card-stack">
                        <div id="row2-container" class="flex items-center justify-center w-full pl-10">
                             <!-- JS Cards -->
                        </div>
                    </div>
                </div>

                <!-- 세 번째 줄: 전체 리스트 -->
                <div class="space-y-6 pb-20">
                    <div class="flex items-center gap-3 mb-4 px-4">
                        <div class="w-10 h-10 bg-gray-100 dark:bg-zinc-800 rounded-xl flex items-center justify-center text-xl">👀</div>
                        <div>
                            <h3 class="text-xl font-bold text-gray-900 dark:text-white">다양한 분야의 전문가</h3>
                            <p class="text-xs text-gray-500 dark:text-gray-400">경력직 전문가들을 만나보세요</p>
                        </div>
                    </div>
                    <div class="w-full overflow-x-auto pb-12 pt-4 px-4 scrollbar-hide">
                        <div id="row3-container" class="flex min-w-max items-center h-64 pl-20">
                             <!-- JS Cards -->
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- header.html fetch -->
   <script src="assets/js/header.js"></script>

    <script>
        const candidates = [
            { name: "김지민", role: "UX/UI Designer", bg: "bg-white dark:bg-zinc-800", tags: ["Figma", "Sketch"] },
            { name: "이준호", role: "Frontend Dev", bg: "bg-pastel-yellow dark:bg-yellow-500/10", tags: ["React", "TS"] }, // 포인트 컬러 카드
            { name: "박서연", role: "Product Manager", bg: "bg-white dark:bg-zinc-800", tags: ["Agile", "Jira"] },
            { name: "최민수", role: "Backend Dev", bg: "bg-white dark:bg-zinc-800", tags: ["Node.js", "AWS"] },
            { name: "정하늘", role: "Brand Marketer", bg: "bg-white dark:bg-zinc-800", tags: ["Brand", "Copy"] },
            { name: "강동원", role: "Data Analyst", bg: "bg-white dark:bg-zinc-800", tags: ["SQL", "Python"] },
            { name: "유재석", role: "Content Creator", bg: "bg-pastel-yellow dark:bg-yellow-500/10", tags: ["Video", "Viral"] }, // 포인트 컬러 카드
            { name: "송혜교", role: "Art Director", bg: "bg-white dark:bg-zinc-800", tags: ["Design", "Lead"] }
        ];

        function createCard(data, index, zIndexBase, overlapClass, rotateRange = 10) {
            const seed = data.name + index;
            const rotate = (Math.random() * rotateRange * 2) - rotateRange;
            
            const card = document.createElement('div');
            // 디자인 변경: 둥근 모서리 강화(rounded-2xl), 테두리 및 그림자 조정
            const isSpecial = data.bg.includes('pastel');
            const borderColor = isSpecial ? 'border-yellow-200 dark:border-yellow-600' : 'border-gray-100 dark:border-zinc-700';
            const textColor = isSpecial ? 'text-gray-900 dark:text-yellow-100' : 'text-gray-800 dark:text-gray-100';

            card.className = `card-item relative w-64 h-40 ${data.bg} rounded-2xl shadow-xl border ${borderColor} flex-shrink-0 flex flex-col p-5 overflow-hidden ${overlapClass}`;
            
            card.style.zIndex = zIndexBase + index;
            card.style.transform = `rotate(${rotate}deg)`;

            card.innerHTML = `
                <div class="flex items-start justify-between gap-3 mb-2">
                    <div class="flex items-center gap-3">
                        <img src="https://api.dicebear.com/9.x/avataaars/svg?seed=${seed}" class="w-10 h-10 rounded-full bg-gray-50 dark:bg-zinc-700 p-0.5 border border-gray-100 dark:border-zinc-600" alt="Avatar">
                        <div>
                            <h4 class="font-bold ${textColor} text-base leading-tight">${data.name}</h4>
                            <p class="text-[10px] text-gray-500 dark:text-gray-400 font-medium tracking-wide uppercase">${data.role}</p>
                        </div>
                    </div>
                    ${isSpecial ? '<span class="text-lg">⭐</span>' : ''}
                </div>
                
                <div class="mt-auto">
                    <div class="flex gap-1.5 flex-wrap">
                        ${data.tags.map(tag => `
                            <span class="px-2 py-0.5 ${isSpecial ? 'bg-white/50 dark:bg-black/20' : 'bg-gray-50 dark:bg-zinc-700'} 
                            text-gray-600 dark:text-gray-300 text-[10px] font-bold rounded border border-transparent dark:border-zinc-600">
                                #${tag}
                            </span>
                        `).join('')}
                    </div>
                </div>
            `;
            return card;
        }

        const row1 = document.getElementById('row1-container');
        [candidates[1], candidates[0], candidates[2]].forEach((data, i) => {
            const card = createCard(data, i, 10, i === 0 ? '' : '-ml-24', 6);
            row1.appendChild(card);
        });

        const row2 = document.getElementById('row2-container');
        const row2Data = [...candidates.slice(3, 7), candidates[0]];
        row2Data.forEach((data, i) => {
            const card = createCard(data, i, 20, i === 0 ? '' : '-ml-32', 8);
            row2.appendChild(card);
        });

        const row3 = document.getElementById('row3-container');
        const row3Data = [...candidates, ...candidates]; 
        row3Data.forEach((data, i) => {
            const card = createCard(data, i, 30, i === 0 ? '' : '-ml-40', 10);
            row3.appendChild(card);
        });
    </script>
<!-- Code injected by live-server -->

		(function () {

				var sheets = [].slice.call(document.getElementsByTagName("link"));

				for (var i = 0; i < sheets.length; ++i) {

</script>
</body>
</html>
