<!-- =========================
  HEADER (ONLY)
  - Works with assets/js/header.js
  - Styles in assets/css/header.css
========================= -->

<header class="sticky top-0 z-50 border-b border-gray-100 dark:border-zinc-800 bg-white/80 dark:bg-zinc-900/80 backdrop-blur-md">
  <div class="max-w-7xl mx-auto px-8 py-4 flex items-center gap-6">
    <!-- LEFT: Logo + Nav -->
    <div class="flex items-center gap-6 shrink-0">
      <a href="index.html" class="flex items-center">
        <h1 class="text-2xl font-black text-point-yellow tracking-tighter hover:opacity-90 transition">
          Poticard
        </h1>
      </a>

      <!-- NAV -->
      <nav id="mainNav" class="hidden lg:flex items-center gap-8 text-gray-400 font-medium">
        <!-- NAMECARD (with menu button) -->
        <div id="flyout-namecard" class="nav-item">
          <div class="nav-title flex items-center gap-2">
            <a href="#namecard" class="hover:text-gray-600 dark:hover:text-gray-300">
              명함
            </a>
          </div>

          <!-- Flyout panel -->
          <div class="nav-panel">
            <div class="rounded-3xl border border-gray-100 dark:border-zinc-800 bg-white/95 dark:bg-zinc-900/95 backdrop-blur-md shadow-2xl p-5">
              <p class="text-xs font-black text-gray-900 dark:text-white mb-3">명함 바로가기</p>
              <div class="grid grid-cols-1 gap-2">
                <a href="/front/namecard_search.html" class="px-4 py-3 rounded-2xl border border-gray-100 dark:border-zinc-800 bg-gray-50 dark:bg-zinc-800/60 hover:border-point-yellow transition text-sm font-bold text-gray-900 dark:text-white">
                  명함 검색
                </a>
                <a href="/front/namecard_modify.html" class="px-4 py-3 rounded-2xl border border-gray-100 dark:border-zinc-800 bg-gray-50 dark:bg-zinc-800/60 hover:border-point-yellow transition text-sm font-bold text-gray-900 dark:text-white">
                  명함 관리
                </a>
                <a href="#namecard" class="px-4 py-3 rounded-2xl border border-gray-100 dark:border-zinc-800 bg-gray-50 dark:bg-zinc-800/60 hover:border-point-yellow transition text-sm font-bold text-gray-900 dark:text-white">
                  추가 예정 기능
                </a>
              </div>
            </div>
          </div>
        </div>

        <!-- PORTFOLIO -->
        <div id="flyout-portfolio" class="nav-item">
          <div class="nav-title">
            <a href="#portfolio" class="hover:text-gray-600 dark:hover:text-gray-300">포트폴리오</a>
          </div>

          <div class="nav-panel">
            <div class="rounded-3xl border border-gray-100 dark:border-zinc-800 bg-white/95 dark:bg-zinc-900/95 backdrop-blur-md shadow-2xl p-5">
              <p class="text-xs font-black text-gray-900 dark:text-white mb-3">포트폴리오</p>
              <div class="grid grid-cols-1 gap-2">
                <a href="/front/create-portfolio-project.html" class="px-4 py-3 rounded-2xl border border-gray-100 dark:border-zinc-800 bg-gray-50 dark:bg-zinc-800/60 hover:border-point-yellow transition text-sm font-bold text-gray-900 dark:text-white">
                  포트폴리오 작성
                </a>
                <a href="/front/portfolio-view.html" class="px-4 py-3 rounded-2xl border border-gray-100 dark:border-zinc-800 bg-gray-50 dark:bg-zinc-800/60 hover:border-point-yellow transition text-sm font-bold text-gray-900 dark:text-white">
                  포트폴리오 목록
                </a>
              </div>
            </div>
          </div>
        </div>

        <!-- JOBS -->
        <div id="flyout-jobs" class="nav-item">
          <div class="nav-title">
            <a href="/front/matching.html" class="hover:text-gray-600 dark:hover:text-gray-300">채용</a>
          </div>

          <div class="nav-panel">
            <div class="rounded-3xl border border-gray-100 dark:border-zinc-800 bg-white/95 dark:bg-zinc-900/95 backdrop-blur-md shadow-2xl p-5">
              <p class="text-xs font-black text-gray-900 dark:text-white mb-3">채용</p>
              <div class="grid grid-cols-1 gap-2">
                <a href="/front/matching.html" class="px-4 py-3 rounded-2xl border border-gray-100 dark:border-zinc-800 bg-gray-50 dark:bg-zinc-800/60 hover:border-point-yellow transition text-sm font-bold text-gray-900 dark:text-white">
                  모집 공고
                </a>
                <a href="jobs.html" class="px-4 py-3 rounded-2xl border border-gray-100 dark:border-zinc-800 bg-gray-50 dark:bg-zinc-800/60 hover:border-point-yellow transition text-sm font-bold text-gray-900 dark:text-white">
                  추천 공고
                </a>
              </div>
            </div>
          </div>
        </div>

        <!-- COMMUNITY -->
        <div id="flyout-community" class="nav-item">
          <div class="nav-title">
            <a href="#chat" class="hover:text-gray-600 dark:hover:text-gray-300">커뮤니티</a>
          </div>

          <div class="nav-panel">
            <div class="rounded-3xl border border-gray-100 dark:border-zinc-800 bg-white/95 dark:bg-zinc-900/95 backdrop-blur-md shadow-2xl p-5">
              <p class="text-xs font-black text-gray-900 dark:text-white mb-3">커뮤니티</p>
              <div class="grid grid-cols-1 gap-2">
                <a href="#chat" class="px-4 py-3 rounded-2xl border border-gray-100 dark:border-zinc-800 bg-gray-50 dark:bg-zinc-800/60 hover:border-point-yellow transition text-sm font-bold text-gray-900 dark:text-white">
                  채팅/알림
                </a>
                <a href="community.html" class="px-4 py-3 rounded-2xl border border-gray-100 dark:border-zinc-800 bg-gray-50 dark:bg-zinc-800/60 hover:border-point-yellow transition text-sm font-bold text-gray-900 dark:text-white">
                  커뮤니티 홈
                </a>
              </div>
            </div>
          </div>
        </div>
      </nav>
    </div>

    <!-- CENTER: Search -->
    <div class="hidden md:flex flex-1 justify-center min-w-0">
      <div class="w-full max-w-md">
        <div class="flex items-center gap-3 rounded-2xl border border-gray-100 dark:border-zinc-800 bg-gray-50 dark:bg-zinc-800/60 px-4 py-3">
          <input
            type="text"
            placeholder="기술 스택 / 이름 / 회사 검색"
            class="w-full bg-transparent outline-none text-sm text-gray-800 dark:text-gray-100 placeholder:text-gray-400"
          />
          <button class="text-[11px] font-bold text-point-yellow bg-yellow-50 dark:bg-yellow-900/30 px-3 py-1.5 rounded-full text-orange-600 dark:text-yellow-300 hover:ring-2 ring-point-yellow transition">
            🔎
          </button>
        </div>
      </div>
    </div>

    <!-- RIGHT: Auth + Icons -->
    <div class="flex items-center gap-3 shrink-0">
  <div class="flex items-center gap-2 pr-2 border-r border-gray-100 dark:border-zinc-800">
    <a
      id="authBtn"
      href="javascript:void(0)"
      class="text-sm font-bold text-gray-900 dark:text-white px-3 py-2 rounded-full border border-gray-200 dark:border-zinc-700 hover:border-point-yellow transition"
    >
      로그인/회원가입
    </a>
  </div>

  <!-- ✅ 다크모드 -->
  <button
    id="themeBtn"
    type="button"
    class="p-2 rounded-xl bg-gray-100 dark:bg-zinc-800 hover:ring-2 ring-point-yellow transition-all"
    title="테마 전환"
  >
    <span class="text-lg">🌓</span>
  </button>

  <!-- ✅ 채팅 -->
  <button
    id="chatBtn"
    type="button"
    class="hidden sm:inline-flex p-2 hover:bg-gray-50 dark:hover:bg-zinc-800 rounded-full"
    title="채팅"
  >
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 22 22" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
    </svg>
  </button>

  <!-- ✅ 알림 -->
  <button
    id="notiBtn"
    type="button"
    class="hidden sm:inline-flex p-2 hover:bg-gray-50 dark:hover:bg-zinc-800 rounded-full relative"
    title="알림"
  >
    <!-- 뱃지 -->
    <span class="absolute -top-0.5 -right-0.5 w-2.5 h-2.5 bg-point-yellow rounded-full"></span>

    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 21 21" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
    </svg>
  </button>
</div>
</header>

<!-- =========================
  AUTH MODAL (개인/법인 포함)
========================= -->
<div id="authModal" class="modal-backdrop" aria-hidden="true">
  <div class="modal-card">
    <div class="rounded-3xl border border-gray-100 dark:border-zinc-800 bg-white/95 dark:bg-zinc-900/95 backdrop-blur-md shadow-2xl p-5">
      <div class="flex items-center justify-between mb-4">
        <p class="text-sm font-black text-gray-900 dark:text-white">회원 선택</p>
        <button
          id="authClose"
          type="button"
          class="w-9 h-9 rounded-xl hover:bg-gray-50 dark:hover:bg-zinc-800 flex items-center justify-center"
          aria-label="닫기"
        >✕</button>
      </div>

      <div class="grid grid-cols-1 gap-3">
        <a
          href="login.html?type=personal"
          class="w-full px-4 py-4 rounded-2xl border border-gray-100 dark:border-zinc-800 bg-gray-50 dark:bg-zinc-800/60 hover:border-point-yellow transition text-left block"
        >
          <span class="text-base font-black text-gray-900 dark:text-white">👤 개인</span>
          <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">개인 회원 로그인/회원가입</p>
        </a>

        <a
          href="login.html?type=corporate"
          class="w-full px-4 py-4 rounded-2xl border border-gray-100 dark:border-zinc-800 bg-gray-50 dark:bg-zinc-800/60 hover:border-point-yellow transition text-left block"
        >
          <span class="text-base font-black text-gray-900 dark:text-white">🏢 법인</span>
          <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">법인 회원 로그인/회원가입</p>
        </a>
      </div>
    </div>
  </div>
</div>
